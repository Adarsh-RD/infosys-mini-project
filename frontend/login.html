<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Identity Resolution Engine</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-dark py-3">
  <div class="container">
    <span class="navbar-brand text-danger fw-bold">
      <i class="fa-solid fa-shield-halved me-2"></i> Identity Resolution Engine
    </span>
    <div>
      <a href="signup.html" class="btn btn-outline-danger me-2">Signup</a>
      <a href="index.html" class="btn btn-light">Home</a>
    </div>
  </div>
</nav>

<div class="container page-hero">
  <div class="row align-items-center">
    <div class="col-md-6 mb-4">
      <h2 class="page-title">Welcome Back</h2>
      <p class="page-subtitle mt-3">
        Login to access your dashboard, view history and manage identity linking & verification.
      </p>
    </div>

    <div class="col-md-6">
      <div class="page-card p-4">
        <form id="loginForm">

          <div class="mb-3">
            <label class="form-label">Email or Phone</label>
            <input type="text" id="emailOrPhone" class="form-control"
                   placeholder="you@example.com or 9876543210" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Enter password" required>
          </div>

          <!-- CAPTCHA -->
          <div class="mb-3">
            <label class="form-label">Captcha Verification</label>
            <div class="d-flex mb-2 align-items-center">
              <input type="text" id="captchaInput" class="form-control me-2"
                     placeholder="Enter Captcha" required>
              <span id="captchaText" class="fw-bold fs-5 text-danger"></span>
            </div>

            <button type="button" id="refreshCaptcha"
                    class="btn btn-sm btn-outline-secondary">
              Refresh Captcha
            </button>

            <div id="captchaError" class="text-danger small mt-1"></div>
          </div>

          <button type="submit" class="btn btn-danger w-100 mt-2">
            Login
          </button>

          <p class="text-center mt-3 mb-0 text-muted">
            New here?
            <a href="signup.html" class="fw-semibold">Create an account</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="./js/auth.js"></script>

<!-- CAPTCHA SCRIPT -->
<script>
  function generateCaptcha() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let cap = "";
    for (let i = 0; i < 5; i++) {
      cap += chars[Math.floor(Math.random() * chars.length)];
    }
    return cap;
  }

  window.currentCaptcha = generateCaptcha();
  document.getElementById("captchaText").innerText = window.currentCaptcha;

  document.getElementById("refreshCaptcha").addEventListener("click", () => {
    window.currentCaptcha = generateCaptcha();
    document.getElementById("captchaText").innerText = window.currentCaptcha;
  });
</script>

</body>
</html>

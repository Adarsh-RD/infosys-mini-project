<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Unlink Identity</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=1778668130403">
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3">
  <div class="container d-flex justify-content-between">
    <span class="navbar-brand fw-bold text-danger">
      <i class="fa-solid fa-shield-halved me-2"></i> Identity Resolution Engine
    </span>
    <a href="dashboard.html" class="btn btn-outline-danger">Dashboard</a>
  </div>
</nav>

<div class="container page-hero">
  <h2 class="page-title">Unlink Identity</h2>
  <p class="page-subtitle">Select identities to unlink and confirm ownership.</p>

  <div class="page-card p-4 mt-4">

    <!-- Identity Cards -->
    <div class="row g-4 text-center mb-4">
      <div class="col-md-3">
        <div class="action-card" onclick="toggleUnlink('AADHAAR', this)">
          <i class="fa-solid fa-id-card action-icon"></i>
          <h6>Aadhaar</h6>
        </div>
      </div>
      <div class="col-md-3">
        <div class="action-card" onclick="toggleUnlink('PHONE', this)">
          <i class="fa-solid fa-phone action-icon"></i>
          <h6>Phone</h6>
        </div>
      </div>
      <div class="col-md-3">
        <div class="action-card" onclick="toggleUnlink('ABHA', this)">
          <i class="fa-solid fa-heart-pulse action-icon"></i>
          <h6>ABHA</h6>
        </div>
      </div>
      <div class="col-md-3">
        <div class="action-card" onclick="toggleUnlink('DIGILOCKER', this)">
          <i class="fa-solid fa-vault action-icon"></i>
          <h6>DigiLocker</h6>
        </div>
      </div>
    </div>

    <!-- Inputs -->
    <div class="row g-3" id="unlinkInputs"></div>

    <!-- Button -->
    <div class="text-center mt-4">
      <button class="btn btn-danger btn-lg px-5" onclick="runUnlink()">
        Unlink Selected Identities
      </button>
    </div>
  </div>

  <!-- Result -->
  <div
  class="card p-4 shadow mt-4"
  id="unlinkResult"
  style="display:none;"
>
  <h4 id="unlinkTitle" class="mb-3"></h4>
  <ul id="unlinkList" class="list-unstyled"></ul>
</div>
</div>

<script src="./js/unlink.js"></script>
</body>
</html>

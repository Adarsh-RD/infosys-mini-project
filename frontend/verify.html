<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Verify Identities</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=1778668130405">
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand text-danger fw-bold">
      <i class="fa-solid fa-shield-halved me-2"></i> Identity Resolution Engine
    </span>
    <a href="dashboard.html" class="btn btn-light">Dashboard</a>
  </div>
</nav>

<div class="container page-hero">

  <h2 class="page-title mb-2">Verify Identities</h2>
  <p class="page-subtitle">
    Enter identities to check if they belong to the same person.
  </p>

  <div class="page-card p-4 mt-4">

    <!-- Identity cards -->
    <div class="row g-4 text-center mb-4">

      <div class="col-md-3">
        <div class="action-card" id="verify-AADHAAR" onclick="toggleVerify('AADHAAR')">
          <i class="fa-solid fa-id-card action-icon"></i>
          <h6>Aadhaar</h6>
        </div>
      </div>

      <div class="col-md-3">
        <div class="action-card" id="verify-PHONE" onclick="toggleVerify('PHONE')">
          <i class="fa-solid fa-phone action-icon"></i>
          <h6>Phone</h6>
        </div>
      </div>

      <div class="col-md-3">
        <div class="action-card" id="verify-ABHA" onclick="toggleVerify('ABHA')">
          <i class="fa-solid fa-heart-pulse action-icon"></i>
          <h6>ABHA</h6>
        </div>
      </div>

      <div class="col-md-3">
        <div class="action-card" id="verify-DIGILOCKER" onclick="toggleVerify('DIGILOCKER')">
          <i class="fa-solid fa-vault action-icon"></i>
          <h6>DigiLocker</h6>
        </div>
      </div>

    </div>

    <!-- Dynamic Inputs -->
    <div class="row g-3" id="verifyInputs"></div>

    <!-- Button -->
    <div class="text-center mt-4">
      <button class="btn btn-danger btn-lg px-5" onclick="runVerification()">
        Run Verification
      </button>
    </div>

  </div>

  <!-- Result -->
  <div class="card p-4 shadow mt-4 d-none" id="resultBox">
    <h4 id="resultTitle"></h4>
    <p id="resultMessage"></p>
    <p><b>Trust Score:</b> <span id="trustScore"></span></p>
    <p><b>Confidence:</b> <span id="confidenceScore"></span></p>
    <p><b>ZKP Proof:</b> <span id="zkpStatus"></span></p>
  </div>

</div>

<script src="./js/verify.js"></script>
<script src="./js/logout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account - Identity Resolution Engine</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=1778668130392">
</head>
<body>

<nav class="navbar navbar-dark bg-dark py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand text-danger fw-bold">
      <i class="fa-solid fa-shield-halved me-2"></i> Identity Resolution Engine
    </span>
    <div>
      <a href="dashboard.html" class="btn btn-light me-2">Dashboard</a>
      <button class="btn btn-outline-danger" onclick="logout()">
        Logout
      </button>
    </div>
  </div>
</nav>

<div class="container page-hero">
  <h2 class="page-title mb-3">My Account</h2>

  <div class="page-card p-4 mb-4">
    <div class="d-flex align-items-center">
      <div class="action-icon me-3">
        <i class="fa-solid fa-user"></i>
      </div>
      <div>
        <h5 class="fw-bold mb-1" id="accountEmail">User</h5>
        <p class="mb-0 text-light small" id="accountPhone"></p>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-pills account-tabs mb-3" id="accountTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="activity-tab" data-bs-toggle="pill"
              data-bs-target="#activity-pane" type="button" role="tab">
        My Activity
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="verifiedby-tab" data-bs-toggle="pill"
              data-bs-target="#verifiedby-pane" type="button" role="tab">
        Verified By Others
      </button>
    </li>
  </ul>

  <div class="tab-content" id="accountTabContent">
    <!-- Activity -->
    <div class="tab-pane fade show active" id="activity-pane" role="tabpanel">
      <div class="page-card p-3" id="activityList">
        <p class="text-light mb-0">Loading your activity…</p>
      </div>
    </div>

    <!-- Verified by -->
    <div class="tab-pane fade" id="verifiedby-pane" role="tabpanel">
      <div class="page-card p-3" id="verifiedByList">
        <p class="text-light mb-0">
          This demo shows verification events where your ID was the target.
        </p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/logout.js"></script>
<script src="./js/account.js"></script>
</body>
</html>

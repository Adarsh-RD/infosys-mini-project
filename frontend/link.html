<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Link Identities</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">

  <style>
    .action-card.selected {
      border: 2px solid #0d6efd;
      background-color: #f0f6ff;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white py-3">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand text-primary fw-bold">
      <i class="fa-solid fa-shield-halved me-2"></i> Identity Resolution Engine
    </span>
    <a href="dashboard.html" class="btn btn-light">Dashboard</a>
  </div>
</nav>

<div class="container page-hero">
  <h2 class="page-title mb-2">Link Identities</h2>
  <p class="page-subtitle">
    Select at least <b>two identities</b>. Complete issuer verification for each.
  </p>

  <div class="page-card p-4 mt-4">

    <!-- Identity Selection -->
    <div class="row g-4 text-center mb-4">
      <div class="col-md-3">
        <div class="action-card" onclick="toggleIdentity('AADHAAR', this)">
          <i class="fa-solid fa-id-card action-icon"></i>
          <h6>Aadhaar</h6>
        </div>
      </div>

      <div class="col-md-3">
        <div class="action-card" onclick="toggleIdentity('PHONE', this)">
          <i class="fa-solid fa-phone action-icon"></i>
          <h6>Phone</h6>
        </div>
      </div>

      <div class="col-md-3">
        <div class="action-card" onclick="toggleIdentity('ABHA', this)">
          <i class="fa-solid fa-heart-pulse action-icon"></i>
          <h6>ABHA</h6>
        </div>
      </div>

      <div class="col-md-3">
        <div class="action-card" onclick="toggleIdentity('DIGILOCKER', this)">
          <i class="fa-solid fa-vault action-icon"></i>
          <h6>DigiLocker</h6>
        </div>
      </div>
    </div>

    <!-- Dynamic Issuer Forms -->
    <div id="issuerForms"></div>
    

    <div class="text-center mt-4">
      <button class="btn btn-primary btn-lg" onclick="linkSelectedIdentities()">
        Link Selected Identities
      </button>
      <div class="text-muted small mt-2">
        All issuer checks must pass. Minimum 2 identities required for first-time linking.
      </div>
      <!-- Link Result Card -->
     <div id="linkResultBox" class="link-result-card d-none mt-4"></div>

    </div>

  </div>
</div>

<script src="./js/link.js"></script>
<script src="./js/logout.js"></script>

</body>
</html>
